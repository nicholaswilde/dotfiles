name: Test Installation Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ENSTOW_VERSION: 0.1.15

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout dotfiles repository
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y age

    - name: Install go-task
      run: |
        sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

    - name: Install enstow
      run: |
        ARCH="$(uname -m)"
        curl -fsSL "https://github.com/nicholaswilde/enstow/releases/download/v${ENSTOW_VERSION}/enstow-${ENSTOW_VERSION}-${ARCH}-unknown-linux-musl.tar.gz" \
          | sudo tar -xz --strip-components=1 -C /usr/local/bin "enstow-${ENSTOW_VERSION}-${ARCH}-unknown-linux-musl/enstow"
        sudo chmod +x /usr/local/bin/enstow
        enstow --version

    - name: Create Ephemeral Key and Mock Encrypted Secrets
      run: |
        mkdir -p "${HOME}/.config/sops/age"
        age-keygen -o "${HOME}/.config/sops/age/keys.txt"
        chmod 600 "${HOME}/.config/sops/age/keys.txt"
        printf 'export DUMMY_TOKEN="placeholder_value"\n' > /tmp/mock_tokens
        enstow encrypt /tmp/mock_tokens -o bash/.tokens.age --age-key-file "${HOME}/.config/sops/age/keys.txt"
        printf 'default_profile: mock\n' > /tmp/mock_pvetui.yml
        enstow encrypt /tmp/mock_pvetui.yml -o pvetui/.config/pvetui/config.yml.age --age-key-file "${HOME}/.config/sops/age/keys.txt"
        rm -f /tmp/mock_tokens /tmp/mock_pvetui.yml

    - name: Dry-run enstow Installation
      run: task test

    - name: Run enstow Installation
      run: task install

    - name: Run enstow Doctor
      run: task doctor

    - name: Run Verification & Unit Test Suite
      run: |
        ./tests/verify.sh
        ./tests/test_check_secrets.sh
        ./tests/test_install_hooks.sh
        ./tests/test_pre_commit_hook.sh
        ./tests/test_skills_catalog_links.sh
