---
version: '3'

vars:
  VER: '3.0'

tasks:
  update:
    desc: Update dotfiles
    cmds:
      - git pull origin main
      - task: update-assets
      - task: restow
      - source ~/.bashrc
  update-assets:
    desc: Update external assets (fzf-git.sh, emoji.txt)
    cmds:
      - curl -fsSL "https://raw.githubusercontent.com/junegunn/fzf-git.sh/main/fzf-git.sh" -o bash/.bash/fzf-git.sh
      - curl -fsSL "https://gist.githubusercontent.com/nicholaswilde/c6e0f837c94dc5454f832be20e2d5b43/raw/emoji.txt" -o bash/.bash/emoji.txt
  agy:
    desc: Run antigravity
    cmds:
      - agy
  bootstrap:
    desc: Bootstrap dotfiles
    cmds:
      - task: install
      - task: install-hooks
  install-hooks:
    desc: Install git pre-commit hook using enstow doctor --staged
    cmds:
      - mkdir -p .git/hooks
      - |
        rm -f .git/hooks/pre-commit
        cat <<'EOF' > .git/hooks/pre-commit
        #!/usr/bin/env sh
        exec enstow doctor --staged -s .
        EOF
        chmod +x .git/hooks/pre-commit
  decrypt:
    desc: Decrypt secret dotfile with enstow (defaults to bash/.tokens.age -> ~/.tokens)
    cmds:
      - |
        if [ -n "{{ .CLI_ARGS }}" ]; then
          enstow decrypt {{ .CLI_ARGS }}
        else
          enstow decrypt bash/.tokens.age -o "${HOME}/.tokens"
        fi
  encrypt:
    desc: Encrypt secret dotfile with enstow (defaults to ~/.tokens -> bash/.tokens.age)
    cmds:
      - |
        if [ -n "{{ .CLI_ARGS }}" ]; then
          enstow encrypt {{ .CLI_ARGS }}
        elif [ -f bash/.tokens ]; then
          enstow encrypt bash/.tokens -o bash/.tokens.age
        else
          enstow encrypt "${HOME}/.tokens" -o bash/.tokens.age
        fi
  edit:
    desc: Interactively edit, re-encrypt, and re-deploy an age secret (defaults to bash/.tokens.age)
    cmds:
      - 'enstow edit --apply {{ .CLI_ARGS | default "bash/.tokens.age" }}'
  deps:
    desc: Install dependencies
    cmds:
      - |
        if command -v enstow >/dev/null 2>&1; then
          enstow --version
        elif command -v brew >/dev/null 2>&1; then
          brew install nicholaswilde/homebrew-tap/enstow
        else
          echo "Install enstow from https://github.com/nicholaswilde/enstow" >&2
          exit 1
        fi
  test:
    desc: Preview enstow apply across configured packages (dry-run)
    cmds:
      - 'enstow apply --dry-run --force {{ .CLI_ARGS }}'
  install:
    desc: Apply configured dotfile packages with enstow
    cmds:
      - 'enstow apply --force {{ .CLI_ARGS }}'
  restow:
    desc: Restow configured dotfile packages with enstow
    cmds:
      - 'enstow restow --force {{ .CLI_ARGS }}'
  restow:fix:
    desc: Apply packages with conflict backup, folded-link unfolding, and stale symlink pruning
    cmds:
      - 'enstow apply --backup {{ .CLI_ARGS }}'
  unstow:
    aliases: [delete]
    desc: Remove managed symlinks and decrypted secrets with enstow
    cmds:
      - 'enstow unstow {{ .CLI_ARGS }}'
  scrub:
    desc: Securely shred decrypted secrets and remove managed symlinks
    cmds:
      - 'enstow scrub {{ .CLI_ARGS }}'
  status:
    desc: Show sync status of managed dotfiles and secrets
    cmds:
      - 'enstow status {{ .CLI_ARGS }}'
  diff:
    desc: Show diff between dotfiles and targets (secrets masked)
    cmds:
      - 'enstow diff {{ .CLI_ARGS }}'
  doctor:
    desc: Audit system health, secret permissions, and symlinks
    cmds:
      - 'enstow doctor {{ .CLI_ARGS }}'
  create-ignore:
    desc: Create a .enstowignore file in a package folder
    preconditions:
      - sh: 'test -n "{{.CLI_ARGS}}"'
        msg: "Package name not specified. Usage: task create-ignore -- <package name>"
      - sh: 'test -d "{{.CLI_ARGS}}"'
        msg: "Directory {{.CLI_ARGS}} not found"
    cmds:
      - touch {{.CLI_ARGS}}/.enstowignore
  nuke:
    desc: Nuke existing files
    cmds:
      - rm -f ~/.config/micro/settings.json
      - rm -f ~/.config/gh/config.yml
  check-secrets:
    desc: Verify staged files for unencrypted secrets and credential leaks
    cmds:
      - enstow doctor --staged -s .
  test-integration:
    desc: Run integration test inside a clean Debian Docker container
    cmds:
      - bash tests/run.sh
  default:
    cmds:
      - task -l
    silent: true
